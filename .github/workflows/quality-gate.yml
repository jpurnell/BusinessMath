name: Quality Gate

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  # On demand. Without this the gate can only be observed by pushing, which makes
  # "is CI actually running the gate?" a question you cannot ask directly — and it
  # went unasked long enough for this workflow to sit disabled while the repository
  # reported four green jobs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    uses: jpurnell/quality-gate-swift/.github/workflows/quality-gate-reusable.yml@main
    with:
      checks: "all"
      continue-on-failure: true
      corpus-repo: jpurnell/org-judgement-corpus
    secrets:
      corpus-token: ${{ secrets.CORPUS_PUSH_TOKEN }}
