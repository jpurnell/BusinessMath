name: Quality Gate

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  # On demand. Without this the gate can only be observed by pushing, which makes
  # "is CI actually running the gate?" a question you cannot ask directly — and it
  # went unasked long enough for this workflow to sit disabled while the repository
  # reported four green jobs.
  workflow_dispatch:

# A called workflow cannot hold more permission than its caller grants, and the
# reusable gate declares `issues: write` so it can file a failure alert. Granting
# only `contents: read` here made GitHub reject the file at parse time — a 0-second
# run titled by path rather than by name, which is what a workflow that never
# started looks like. Almost certainly why this workflow was disabled rather than
# fixed: the failure says "workflow file issue" and points at the caller, while the
# missing permission is named in the callee.
permissions:
  contents: read
  issues: write

jobs:
  quality-gate:
    uses: jpurnell/quality-gate-swift/.github/workflows/quality-gate-reusable.yml@main
    with:
      checks: "all"
      continue-on-failure: true
      corpus-repo: jpurnell/org-judgement-corpus
    secrets:
      corpus-token: ${{ secrets.CORPUS_PUSH_TOKEN }}
