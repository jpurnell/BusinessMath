name: CI

on:
  push:
    branches: [ main ]
    # macOS runners bill at 10x, and this matrix takes 16-19 minutes. The 2.7.0 release
    # commit changed CHANGELOG.md, README.md and project/ — not one line of Swift — and
    # still cost a full macOS run. Nothing listed here can change what `swift build`
    # produces. `*.md` is deliberately root-only: `**.md` would also exclude the .docc
    # catalogue, and an article that stops compiling is a real failure.
    paths-ignore:
      - '*.md'
      - 'project/**'
      - 'development-guidelines/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'project/**'
      - 'development-guidelines/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests:
    name: Tests (${{ matrix.os }} / ${{ matrix.engine }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
        engine: [swift-testing]
    env:
      PACKAGE_NAME: BusinessMath
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.x (Swift 6.2)
        if: matrix.os == 'macos-26'
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26* 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 26.x found, using default"
            xcodebuild -version
          else
            sudo xcode-select -s "$XCODE_PATH"
            echo "Selected: $XCODE_PATH"
            xcodebuild -version
          fi

      - name: Install Swift (Linux)
        if: matrix.os == 'ubuntu-24.04'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'

      - name: Cache Swift build (Linux)
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/cache@v4
        with:
          path: .build-swift-testing
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Tooling versions
        run: |
          swift --version
          if command -v xcodebuild >/dev/null 2>&1; then
            xcodebuild -version
          fi

      - name: Select test engine and scratch path
        run: |
          if [ "${{ matrix.engine }}" = "swift-testing" ]; then
            echo "SWIFT_TEST_FLAGS=--enable-swift-testing" >> $GITHUB_ENV
            echo "SCRATCH=.build-swift-testing" >> $GITHUB_ENV
          else
            echo "SWIFT_TEST_FLAGS=" >> $GITHUB_ENV
            echo "SCRATCH=.build-xctest" >> $GITHUB_ENV
          fi
      - name: Build + Test (Debug)
        run: |
          set -uo pipefail

          if [ "${{ matrix.engine }}" = "swift-testing" ]; then
            # Distinguish "listing failed" from "no tests exist". These used to be
            # conflated: a failure to resolve dependencies produced no output, the
            # empty output was read as "this project has no @Test cases", and the
            # job exited 0 — reporting green while running none of the suite.
            if ! LISTED=$(swift test --enable-swift-testing --list-tests --scratch-path "$SCRATCH"); then
              echo "::error::Could not list tests — dependency resolution or build failed. This is a failure, not an empty suite."
              exit 1
            fi
            if [ -z "$(printf '%s' "$LISTED" | tr -d '[:space:]')" ]; then
              echo "No Swift Testing (@Test) tests found; skipping swift-testing leg."
              exit 0
            fi
          else
            swift test --list-tests --scratch-path "$SCRATCH" || true
          fi

          swift build --build-tests $SWIFT_TEST_FLAGS --scratch-path "$SCRATCH" -v

          # A hang is guarded by the job's timeout-minutes (fails visibly). The earlier
          # sample()-capturing watchdog was diagnostic scaffolding for the streaming
          # exit hang fixed in 2.5.1; it is intentionally removed so a future hang fails
          # the job rather than being silently killed and reported green.
          # No `|| true`: a failing test must fail the job. Previously it did not,
          # which left `swift build --build-tests` as the only thing that could turn
          # this job red — so the suite could fail wholesale and still report green.
          swift test $SWIFT_TEST_FLAGS --scratch-path "$SCRATCH" -v

  build_and_compile:
    name: Release build
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.x (Swift 6.2)
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26* 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 26.x found, using default"
          else
            sudo xcode-select -s "$XCODE_PATH"
            echo "Selected: $XCODE_PATH"
          fi

      - name: Tooling versions
        run: |
          xcodebuild -version
          swift --version

      - name: Release build (SPM)
        run: swift build -c release -Xswiftc -Xfrontend -Xswiftc -solver-expression-time-threshold=500

  linux_compile:
    name: Linux release compile check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift (Linux)
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'

      - name: Cache Swift build (Linux)
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swift-release-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-release-
            ${{ runner.os }}-swift-

      - name: Tooling versions
        run: swift --version

      - name: Release build (Linux)
        run: |
          set -euo pipefail
          swift build -c release -Xswiftc -Xfrontend -Xswiftc -solver-expression-time-threshold=500 -v

      - name: Compile tests (Linux, debug with enable-testing)
        run: |
          set -euo pipefail
          swift build --build-tests -c debug -Xswiftc -enable-testing -v
