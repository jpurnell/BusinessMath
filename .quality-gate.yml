# NOTE ON KEYS. This file is decoded against a fixed schema and unknown keys are
# discarded without a word. Two keys here were doing nothing for as long as they
# have existed:
#
#   exclude:   — there is no such config key; `--exclude` is a CLI flag only.
#   checkers:  — the key is `enabledCheckers`.
#
# The second one mattered. The file read as "run everything", the gate read
# nothing, and it fell back to its default set — which omitted `recursion`. That
# is the checker that finds unbounded recursion, and an unbounded recursion is
# how `FormulaEvaluator` came to be crashable by a long formula. The check was
# never declined; it was never run.
#
# Both are removed rather than corrected, because correcting `checkers:` is a
# trap of its own: `enabledCheckers` REPLACES the default set with the literal
# ids given, and no checker is named "all". Writing `enabledCheckers: [all]`
# would run nothing. A full run is `--check all` at the invocation.

# Agent worktrees are a tool's working area, not source — the same category as
# .build. They hold stale snapshots of files that have since been fixed on main,
# so every finding there is a defect that no longer exists anywhere shippable,
# counted once per worktree. Scanning them pinned the gate at 53 errors that no
# edit to this repository could clear, which is worse than useless: a gate that
# is permanently red teaches everyone to read FAILED as "fine".
excludePatterns:
  - "**/.claude/worktrees/**"

# `ModelDebugger` models failure as a value rather than by logging or rethrowing, which is the
# case `errorValueTypes` exists for: `traced(_:)` returns a `DebugTrace` carrying the error to
# the caller, so nothing disappears. The checker's own documentation draws the line — the rule
# is there to catch `catch { }`, `catch { return nil }`, an error that *vanishes* — and it
# requires that **every** exit of the block produce one of the named types. The flagged block
# has exactly one exit and it produces a `DebugTrace` with `error: error` set.
#
# This is a declaration, not a suppression. `DebugTrace(` appears in one file, so the statement
# is as narrow as the fact it records, and it is deliberately a sentence a reviewer can
# disagree with rather than an inline marker that hides.
#
# It is not the alternative fixes, both of which are worse: adding a `logger.error()` beside the
# `logger.calculationFailed(value, error:)` already there is duplicate logging to satisfy a
# pattern, and renaming that call to `error` would flatten a semantic logging API into the
# checker's vocabulary.
logging:
  errorValueTypes: ["DebugTrace"]

consistency:
  # `corpusPath` is deliberately absent. It is an absolute path to a checkout that exists
  # on one machine, and this file is tracked — so naming it here would publish a home
  # directory layout and still be wrong everywhere else. Without it the checker reports
  # "IJS corpus not configured — consistency check skipped" and passes. Set it locally
  # (uncommitted) if you want the consistency check to run.
  projectID: BusinessMath
  consistencyThreshold: 0.7
  defaultRiskTier: 2

# v2 layout: the master plan is project-owned, not framework content.
status:
  guidelinesPath: "."
  masterPlanPath: project/master_plan.md

# Refuse to trust a gate binary older than this. A stale binary silently runs
# old rules; without this pin nothing says so. Ratchet on each deploy that the
# repo depends on. Warns on every run; fails only under --strict.
minimumGateVersion: "2026-09-03"
